name: Release desktop apps

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      mac_ref:
        description: "macOS source branch"
        required: true
        default: "mac"
      release_tag:
        description: "Release tag"
        required: true
        default: "v0.2.0"

permissions:
  contents: write

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.9.0"

jobs:
  macos:
    name: macOS arm64
    runs-on: macos-14
    steps:
      - name: Checkout macOS source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.mac_ref || github.ref_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate macOS release version
        shell: bash
        run: |
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}"
          expected="${tag#v}"
          for file in package.json apps/desktop/package.json; do
            version=$(node -p "require('./$file').version")
            test "$version" = "$expected" || { echo "$file version $version does not match $expected"; exit 1; }
          done

      - name: Build unsigned macOS arm64 package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm package:mac -- --publish never

      - name: Publish macOS assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          name: YoomClaw macOS ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml
            release/*.blockmap
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
